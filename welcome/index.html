<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chào mừng bạn ghé thăm</title>

<!-- Đặt chủ đề theo giờ TRƯỚC khi render để tránh nháy màu -->
<script>
  (function () {
    var h = new Date().getHours();
    var t = h >= 5 && h < 11 ? 'morning'
          : h >= 11 && h < 13 ? 'noon'
          : h >= 13 && h < 18 ? 'afternoon'
          : h >= 18 && h < 22 ? 'evening'
          : 'night';
    document.documentElement.dataset.time = t;
  })();
</script>

<style>
  /* ===== Bảng màu theo thời điểm trong ngày ===== */
  :root {
    --g1: #ffd89b; --g2: #ffb07c; --g3: #ff8fa3;
    --orb1: #fff3c4; --orb2: #ffc9a3; --orb3: #ffb3c6;
    --accent: #e8890c;
    --card: rgba(255, 255, 255, .93);
    --text: #1f2430;
    --muted: #6b7280;
    --border: rgba(255, 255, 255, .6);
    --shadow: 0 24px 60px rgba(120, 60, 20, .22);
  }
  :root[data-time="noon"] {
    --g1: #a8e0ff; --g2: #6cc5f5; --g3: #4a9ee8;
    --orb1: #ffffff; --orb2: #bfe9ff; --orb3: #9ad4ff;
    --accent: #f5a623;
    --shadow: 0 24px 60px rgba(20, 70, 130, .25);
  }
  :root[data-time="afternoon"] {
    --g1: #ffd28a; --g2: #f79d65; --g3: #e2725b;
    --orb1: #fff0cf; --orb2: #ffc59b; --orb3: #f9a48c;
    --accent: #e07b1f;
    --shadow: 0 24px 60px rgba(140, 60, 30, .28);
  }
  :root[data-time="evening"] {
    --g1: #f7a072; --g2: #c86b8a; --g3: #7b5ea7;
    --orb1: #ffd9b3; --orb2: #e39ab5; --orb3: #a98cd4;
    --accent: #b06ab3;
    --shadow: 0 24px 60px rgba(60, 20, 80, .35);
  }
  :root[data-time="night"] {
    --g1: #1b2a4a; --g2: #24304f; --g3: #141d33;
    --orb1: #3d5a8a; --orb2: #4a6fa5; --orb3: #2c3e63;
    --accent: #cbd9f5;
    --card: rgba(28, 36, 56, .88);
    --text: #eef2fa;
    --muted: #9aa8c4;
    --border: rgba(255, 255, 255, .12);
    --shadow: 0 24px 60px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(160deg, var(--g1), var(--g2) 45%, var(--g3));
    background-size: 200% 200%;
    animation: shift 24s ease-in-out infinite;
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  @keyframes shift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ===== Quả cầu màu trôi nổi ở nền ===== */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .55;
    pointer-events: none;
    will-change: transform;
  }
  .o1 { width: 46vmax; height: 46vmax; background: var(--orb1);
        top: -18vmax; left: -12vmax;  animation: drift1 26s ease-in-out infinite; }
  .o2 { width: 38vmax; height: 38vmax; background: var(--orb2);
        bottom: -16vmax; right: -10vmax; animation: drift2 32s ease-in-out infinite; }
  .o3 { width: 28vmax; height: 28vmax; background: var(--orb3);
        bottom: 8vmax; left: 6vmax;   animation: drift3 38s ease-in-out infinite; }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(6vmax, 4vmax) scale(1.12); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1.08); }
    50%      { transform: translate(-7vmax, -5vmax) scale(1); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(4vmax, -6vmax) scale(1.15); }
  }

  /* ===== Thẻ chào mừng ===== */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    text-align: center;
    padding: 46px 34px 30px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 26px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    animation: rise .8s cubic-bezier(.2, .8, .2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(22px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }

  /* ===== Biểu tượng mặt trời / mặt trăng ===== */
  .icon {
    width: 104px;
    height: 104px;
    margin: 0 auto 22px;
    color: var(--accent);
    animation: float 5s ease-in-out infinite, fade .9s .15s both;
  }
  .icon svg { width: 100%; height: 100%; display: block; }

  /* Mặt trời hiện ban ngày, mặt trăng hiện ban đêm */
  .icon .sun  { display: block; }
  .icon .moon { display: none; }
  :root[data-time="evening"] .icon .sun,
  :root[data-time="night"]   .icon .sun  { display: none; }
  :root[data-time="evening"] .icon .moon,
  :root[data-time="night"]   .icon .moon { display: block; }

  /* Tia nắng quay chậm */
  .icon .rays {
    transform-origin: 60px 60px;
    animation: spin 40s linear infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ===== Lời chào ===== */
  h1 {
    margin: 0 0 10px;
    font-size: clamp(27px, 6.6vw, 40px);
    font-weight: 700;
    letter-spacing: -.025em;
    line-height: 1.2;
    animation: fade .9s .3s both;
  }

  .wish {
    margin: 0 auto;
    max-width: 34ch;
    font-size: clamp(15px, 3.6vw, 17.5px);
    line-height: 1.6;
    color: var(--muted);
    animation: fade .9s .45s both;
  }

  /* ===== Dòng chân trang ===== */
  .foot {
    margin: 30px 0 0;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--muted);
    animation: fade .9s .6s both;
  }

  @media (max-width: 420px) {
    .card { padding: 36px 22px 24px; border-radius: 22px; }
    .icon { width: 84px; height: 84px; margin-bottom: 18px; }
  }

  /* Tôn trọng cài đặt giảm chuyển động của hệ điều hành */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<div class="orb o1" aria-hidden="true"></div>
<div class="orb o2" aria-hidden="true"></div>
<div class="orb o3" aria-hidden="true"></div>

<main class="card">
  <div class="icon" aria-hidden="true">
    <!-- Mặt trời -->
    <svg class="sun" viewBox="0 0 120 120" fill="none">
      <g class="rays" stroke="currentColor" stroke-width="6" stroke-linecap="round">
        <line x1="60" y1="7"   x2="60" y2="22"/>
        <line x1="60" y1="98"  x2="60" y2="113"/>
        <line x1="7"  y1="60"  x2="22" y2="60"/>
        <line x1="98" y1="60"  x2="113" y2="60"/>
        <line x1="22" y1="22"  x2="33" y2="33"/>
        <line x1="87" y1="87"  x2="98" y2="98"/>
        <line x1="98" y1="22"  x2="87" y2="33"/>
        <line x1="33" y1="87"  x2="22" y2="98"/>
      </g>
      <circle cx="60" cy="60" r="25" fill="currentColor"/>
    </svg>

    <!-- Mặt trăng -->
    <svg class="moon" viewBox="0 0 120 120" fill="none">
      <defs>
        <mask id="crescent">
          <rect width="120" height="120" fill="#fff"/>
          <circle cx="88" cy="42" r="42" fill="#000"/>
        </mask>
      </defs>
      <circle cx="56" cy="62" r="43" fill="currentColor" mask="url(#crescent)"/>
      <circle cx="94" cy="26" r="3.5" fill="currentColor" opacity=".75"/>
      <circle cx="106" cy="52" r="2.5" fill="currentColor" opacity=".55"/>
      <circle cx="88" cy="70" r="2"   fill="currentColor" opacity=".65"/>
    </svg>
  </div>

  <h1 id="greeting">Chào mừng bạn ghé thăm</h1>
  <p class="wish" id="wish">Rất vui được gặp bạn ở đây!</p>

  <p class="foot">
    <span id="privacy">Lượt truy cập được ghi lại để thống kê.</span>
  </p>
</main>

<script>
(() => {
  'use strict';

  // ===== CẤU HÌNH LƯU DỮ LIỆU =====
  // Dán URL /exec của Apps Script Web App vào đây sau khi deploy.
  // Để trống thì trang vẫn chạy bình thường, chỉ là không lưu gì.
  const CONFIG = {
    ENDPOINT: 'https://script.google.com/macros/s/AKfycbzUsWZ68xoHTiDg343Jq1Y3u07_W7Sl1--l6DKe2IfwETIpaLcSOaVD0-KWDaBbASsO/exec',                                   // vd: 'https://script.google.com/macros/s/AKfy.../exec'
    TOKEN: 'PxngHu9U7wohl5fGE2Q6bksdVy08iAO3CqDJpKmz'   // phải khớp SHARED_TOKEN trong Code.gs
  };

  /**
   * Danh sách nhà cung cấp API tra IP.
   * Trình duyệt KHÔNG thể tự biết IP công khai của mình — bắt buộc phải hỏi
   * một máy chủ bên ngoài. Vì vậy ở đây dùng nhiều nguồn dự phòng: nguồn nào
   * trả lời trước sẽ được dùng, các nguồn sau bổ sung thêm thông tin.
   */
  const PROVIDERS = [
    {
      name: 'ipwho.is',
      url: 'https://ipwho.is/',
      parse: d => d && d.success !== false && d.ip ? {
        ip: d.ip,
        city: d.city,
        region: d.region,
        country: d.country,
        countryCode: d.country_code,
        isp: d.connection && d.connection.isp,
        timezone: d.timezone && d.timezone.id
      } : null
    },
    {
      name: 'ipapi.co',
      url: 'https://ipapi.co/json/',
      parse: d => d && !d.error && d.ip ? {
        ip: d.ip,
        city: d.city,
        region: d.region,
        country: d.country_name,
        countryCode: d.country_code,
        isp: d.org,
        timezone: d.timezone
      } : null
    },
    {
      name: 'ipinfo.io',
      url: 'https://ipinfo.io/json',
      parse: d => d && d.ip ? {
        ip: d.ip,
        city: d.city,
        region: d.region,
        country: d.country,
        countryCode: d.country,
        isp: d.org,
        timezone: d.timezone
      } : null
    },
    {
      name: 'api64.ipify.org',
      url: 'https://api64.ipify.org?format=json',
      parse: d => d && d.ip ? { ip: d.ip } : null
    }
  ];

  const TIMEOUT_MS = 6000;

  // ===== LỜI CHÀO THEO THỜI ĐIỂM =====

  const GREETINGS = {
    morning:   { title: 'Chào buổi sáng',  wish: 'Chúc bạn một ngày mới tràn đầy năng lượng và niềm vui!' },
    noon:      { title: 'Chào buổi trưa',  wish: 'Chúc bạn một buổi trưa thư giãn và ngon miệng!' },
    afternoon: { title: 'Chào buổi chiều', wish: 'Chúc bạn một buổi chiều làm việc thật hiệu quả!' },
    evening:   { title: 'Chào buổi tối',   wish: 'Chúc bạn một buổi tối ấm áp bên những người thân yêu!' },
    night:     { title: 'Chúc ngủ ngon',   wish: 'Chúc bạn ngủ ngon và có những giấc mơ thật đẹp!' }
  };

  (function greet() {
    const slot = document.documentElement.dataset.time;
    const g = GREETINGS[slot] || GREETINGS.morning;
    document.getElementById('greeting').textContent = g.title;
    document.getElementById('wish').textContent = g.wish;
  })();

  // ===== GHI NHẬN LƯỢT TRUY CẬP (chạy ngầm, không hiển thị) =====

  /** Gộp thông tin từ nhiều nguồn: trường nào có trước thì giữ. */
  let data = {};

  /** Gọi 1 API, tự hủy nếu quá TIMEOUT_MS. */
  async function query(provider) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(provider.url, {
        signal: ctrl.signal,
        cache: 'no-store',
        headers: { Accept: 'application/json' }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const parsed = provider.parse(await res.json());
      if (!parsed || !parsed.ip) throw new Error('Dữ liệu không hợp lệ');
      return parsed;
    } finally {
      clearTimeout(timer);
    }
  }

  /** Đoán trình duyệt / hệ điều hành / loại thiết bị từ User-Agent.
   *  Chỉ là ước lượng — UA có thể bị giả hoặc bị rút gọn (Safari, Firefox). */
  function describeUA() {
    const ua = navigator.userAgent;

    let browser = 'Khác';
    if (/Edg\//.test(ua))                        browser = 'Edge';
    else if (/OPR\/|Opera/.test(ua))               browser = 'Opera';
    else if (/SamsungBrowser/.test(ua))            browser = 'Samsung Internet';
    else if (/Firefox\/|FxiOS/.test(ua))          browser = 'Firefox';
    else if (/CriOS/.test(ua))                    browser = 'Chrome (iOS)';
    else if (/Chrome\//.test(ua))                  browser = 'Chrome';
    else if (/Safari\//.test(ua))                  browser = 'Safari';

    let os = 'Khác';
    if (/Windows NT 10/.test(ua))                   os = 'Windows 10/11';
    else if (/Windows/.test(ua))                    os = 'Windows';
    else if (/Android/.test(ua))                    os = 'Android';
    else if (/iPhone|iPad|iPod/.test(ua))           os = 'iOS';
    else if (/Mac OS X/.test(ua))                   os = 'macOS';
    else if (/Linux/.test(ua))                      os = 'Linux';

    const device = /iPad|Tablet/.test(ua) ? 'Máy tính bảng'
      : /Mobi|Android|iPhone/.test(ua) ? 'Điện thoại'
      : 'Máy tính';

    return { browser, os, device, ua };
  }

  let saved = false;

  /** Gửi dữ liệu truy cập về Apps Script để ghi vào Google Sheet.
   *  Chạy nền — lỗi ở đây hoàn toàn không ảnh hưởng tới người dùng. */
  function collect() {
    if (saved || !CONFIG.ENDPOINT || !data.ip) return;
    saved = true;

    const ua = describeUA();
    const payload = {
      token: CONFIG.TOKEN,
      ip: data.ip,
      city: data.city || '',
      region: data.region || '',
      country: data.country || '',
      countryCode: data.countryCode || '',
      isp: data.isp || '',
      timezone: data.timezone || '',
      browser: ua.browser,
      os: ua.os,
      device: ua.device,
      userAgent: ua.ua,
      language: navigator.language || '',
      referrer: document.referrer || 'trực tiếp',
      page: location.href,
      screen: screen.width + 'x' + screen.height
    };

    // Content-Type text/plain để trình duyệt không gửi CORS preflight (OPTIONS).
    // Apps Script không xử lý được preflight nên nếu dùng application/json sẽ lỗi.
    // Apps Script vẫn đọc được JSON qua e.postData.contents.
    fetch(CONFIG.ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',        // Apps Script không trả CORS header → không đọc được response
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      keepalive: true         // gửi tiếp cả khi người dùng rời trang
    }).catch(() => {
      // Không ảnh hưởng người dùng, nhưng báo ra Console để còn gỡ lỗi.
      console.warn('[check-ip] Không gửi được dữ liệu. Kiểm tra: (1) Web App đã deploy với ' +
        '"Who has access: Anyone" chưa, (2) CONFIG.TOKEN có khớp SHARED_TOKEN trong Code.gs không.');
    });
  }

  /** Tra IP từ tất cả nguồn song song; xong hết thì gửi một lần
   *  để có đủ cả IP lẫn vị trí / nhà mạng. */
  (async function lookup() {
    let done = 0;

    await Promise.all(PROVIDERS.map(async provider => {
      try {
        const result = await query(provider);
        for (const [k, v] of Object.entries(result)) {
          if (v && !data[k]) data[k] = v;
        }
      } catch (_) {
        /* nguồn này lỗi — các nguồn khác vẫn chạy */
      } finally {
        if (++done === PROVIDERS.length) collect();
      }
    }));
  })();

  // Chỉ hiện thông báo thu thập khi thực sự có nơi lưu.
  if (!CONFIG.ENDPOINT) {
    document.getElementById('privacy').textContent = 'Trang không lưu lại thông tin truy cập.';
  }
})();
</script>

</body>
</html>
